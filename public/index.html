<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202e; --ink-2:#233146; --paper:#eef0f3; --card:#fff; --line:#d9dee5; --muted:#5b6878;
  --amber:#f0a81c; --in:#17794f; --out:#2b5ba8; --late:#a85d00; --bad:#b3281f;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{font-family:var(--font);font-size:15px;color:var(--ink);background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
h1,h2,h3,p{margin:0}
h1{font-size:1.75rem;font-weight:600;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--ink);color:#e8edf3;padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{padding:0 10px;font-weight:600;font-size:1.05rem;line-height:1.25}
.brand small{display:block;font-weight:400;color:#9fb0c4;font-size:.8rem;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:#c9d4e0;text-decoration:none;padding:10px 12px;border-radius:6px;border-left:3px solid transparent}
.nav a:hover{background:var(--ink-2)}
.nav a[aria-current=page]{background:var(--ink-2);color:#fff;border-left-color:var(--amber);font-weight:500}
.side .out{margin-top:auto}
.side .out button{width:100%;background:transparent;border:1px solid #3a4a60;color:#c9d4e0;padding:9px;border-radius:6px;cursor:pointer}
.side .out button:hover{background:var(--ink-2)}
main{padding:30px clamp(16px,4vw,44px) 60px;max-width:1180px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{border:1px solid var(--line);background:var(--card);padding:0 14px;height:38px;border-radius:6px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#aab4c0}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--ink-2)}
.btn.danger{color:var(--bad)}
.btn.sm{height:32px;padding:0 10px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.88rem;font-weight:500}
input,select{height:38px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:#fff;width:100%}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.hint{font-size:.85rem;color:var(--muted)}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}

/* panels & tables */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}
.panel-pad{padding:20px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:.88rem;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--muted);font-size:.85rem}
td.acts{text-align:right;white-space:nowrap}
td.acts .btn{margin-left:6px}
.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.84rem;font-weight:500;border:1px solid currentColor;white-space:nowrap}
.chip.ok,.chip.Present{color:var(--in)}
.chip.In{color:var(--out)}
.chip.Late,.chip.wait{color:var(--late)}
.chip.Absent,.chip.Missing{color:var(--bad)}
.chip.none,.chip.Off,.chip.Not{color:var(--muted)}

/* today */
.plate{background:var(--ink);color:var(--amber);border-radius:8px;padding:10px 18px;text-align:right}
.plate .t{font-size:2.4rem;line-height:1.1;font-weight:500;letter-spacing:.02em}
.plate .d{font-size:.85rem;color:#b9c5d3}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-size:1.6rem;font-weight:600}
.stat span{color:var(--muted);font-size:.9rem}
.tape-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.devs{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#a3adb9;margin-right:6px}
.dot.on{background:var(--in)}
.tape{list-style:none;margin:0;padding:0}
.tape li{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px dashed var(--line)}
.tape li:last-child{border-bottom:0}
.tape time{font-size:1.15rem;font-weight:500}
.tape time small{display:block;font-size:.76rem;font-weight:400;color:var(--muted)}
.who strong{display:block;font-weight:500}
.who span{color:var(--muted);font-size:.85rem;margin-right:12px}
.stamp{font-weight:600;letter-spacing:.06em;padding:3px 10px;border:2px solid;border-radius:3px;min-width:52px;text-align:center}
.stamp.IN{color:var(--in)} .stamp.OUT{color:var(--out)}
.fresh{animation:fresh 2.2s ease-out}
@keyframes fresh{from{background:#fff3d1}to{background:transparent}}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--amber)}

/* modal, toast */
.scrim{position:fixed;inset:0;background:rgba(22,32,46,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:10px;width:min(480px,100%);max-height:92vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:6px}
.enroll{text-align:center;padding:10px 0}
.enroll .big{font-size:1.25rem;font-weight:500;margin:14px 0 6px}
.pulse{width:64px;height:64px;border-radius:50%;margin:0 auto;border:4px solid var(--amber);animation:pulse 1.4s ease-in-out infinite}
.pulse.done{border-color:var(--in);animation:none;background:var(--in)}
.pulse.fail{border-color:var(--bad);animation:none}
@keyframes pulse{0%,100%{transform:scale(.88);opacity:.6}50%{transform:scale(1.04);opacity:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;z-index:60;max-width:90vw}
.toast.bad{background:var(--bad)}
.key{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;background:var(--paper);padding:4px 8px;border-radius:4px;word-break:break-all}
.checks{display:flex;gap:14px;flex-wrap:wrap}
.checks label{display:flex;gap:6px;align-items:center;font-weight:400}
.checks input{width:auto;height:auto}
.stack{display:flex;flex-direction:column;gap:16px}
.split{display:grid;gap:22px;grid-template-columns:1fr}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{width:min(380px,100%);display:flex;flex-direction:column;gap:16px;padding:28px}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  .nav{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3}
  .nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0}
  .nav a[aria-current=page]{border-bottom-color:var(--amber)}
  .side .out{margin:0 0 0 auto}
  .tape li{grid-template-columns:78px 1fr auto}
}
@media (prefers-reduced-motion:reduce){.pulse,.fresh{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
const state = { company: 'Lumina Automations' };
let timers = [];
const stopTimers = () => { timers.forEach(clearInterval); timers = []; };

async function api(path, method = 'GET', body) {
  const opt = { method, credentials: 'same-origin' };
  if (method !== 'GET' && method !== 'DELETE') { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body || {}); }
  const r = await fetch(path, opt);
  let data = {};
  try { data = await r.json(); } catch {}
  if (r.status === 401 && path !== '/api/login') { showLogin(); throw new Error('Please log in.'); }
  if (!r.ok) throw new Error(data.error || 'Request failed.');
  return data;
}
function toast(msg, bad) {
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
function openModal(html, onClose) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(scrim);
  const el = scrim.firstElementChild;
  const close = () => { scrim.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  scrim.addEventListener('mousedown', (e) => { if (e.target === scrim) close(); });
  el.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) close(); });
  const first = el.querySelector('input,select,button'); if (first) first.focus();
  return { el, close };
}
function confirmBox(title, text, okLabel) {
  return new Promise((resolve) => {
    let ok = false;
    const m = openModal(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="cok">${esc(okLabel)}</button></div>`, () => resolve(ok));
    $('#cok', m.el).onclick = () => { ok = true; m.close(); };
  });
}
const fmtHM = (m) => (m > 0 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m` : '–');
function ago(ts) {
  if (!ts) return 'never';
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 10) return 'just now'; if (s < 60) return s + ' s ago';
  if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return Math.floor(s / 86400) + ' days ago';
}
const statusChip = (r) => {
  const label = r.status === 'Late' && r.late_min ? `Late ${r.late_min} min` : r.status;
  return `<span class="chip ${esc(r.status.split(' ')[0])}">${esc(label)}</span>`;
};

/* ---------- login & shell ---------- */
function showLogin() {
  stopTimers();
  app.innerHTML = `<div class="login"><form class="panel" id="lf">
    <div><h1>${esc(state.company)}</h1><p class="muted">Attendance dashboard</p></div>
    <div class="field"><label for="u">Username</label><input id="u" autocomplete="username" value="admin" required></div>
    <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
    <div class="err" id="le" role="alert"></div>
    <button class="btn primary" style="justify-content:center">Log in</button></form></div>`;
  $('#p').focus();
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    try { await api('/api/login', 'POST', { username: $('#u').value, password: $('#p').value }); boot(); }
    catch (err) { $('#le').textContent = err.message; }
  };
}
const NAV = [['today', 'Today'], ['employees', 'Employees'], ['attendance', 'Attendance'], ['devices', 'Devices'], ['settings', 'Settings']];
function showShell() {
  app.innerHTML = `<div class="shell"><aside class="side"><div class="brand">${esc(state.company)}<small>Attendance</small></div>
    <nav class="nav" aria-label="Main">${NAV.map(([k, l]) => `<a href="#/${k}" data-nav="${k}">${l}</a>`).join('')}</nav>
    <div class="out"><button id="logout">Log out</button></div></aside><main id="view"></main></div>`;
  $('#logout').onclick = async () => { await api('/api/logout', 'POST'); showLogin(); };
  render();
}
async function render() {
  stopTimers();
  const key = (location.hash.replace('#/', '') || 'today').split('?')[0];
  const view = views[key] ? key : 'today';
  document.querySelectorAll('[data-nav]').forEach((a) => { if (a.dataset.nav === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.title = NAV.find((n) => n[0] === view)[1] + ' · ' + state.company;
  const el = $('#view'); el.innerHTML = '';
  try { await views[view](el); } catch (e) { if (e.message !== 'Please log in.') el.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
window.addEventListener('hashchange', () => { if ($('#view')) render(); });

const views = {};

/* ---------- today ---------- */
views.today = async (el) => {
  el.innerHTML = `<header class="page-head"><div><h1>Today</h1><p class="muted" id="sub">Live punches from your devices</p></div>
    <div class="plate"><div class="t num" id="clk">--:--:--</div><div class="d" id="dte"></div></div></header>
    <section class="stats" id="stats"></section>
    <section class="panel"><div class="tape-head"><h2>Live punches</h2><div class="devs" id="devs"></div></div><ol class="tape" id="tape"></ol></section>`;
  let offset = 0, zone = 'UTC', lastId = null;
  const tick = () => {
    const d = new Date(Date.now() + offset * 1000);
    $('#clk').textContent = new Intl.DateTimeFormat('en-GB', { timeZone: zone, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).format(d);
    $('#dte').textContent = new Intl.DateTimeFormat('en-GB', { timeZone: zone, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(d);
  };
  const load = async () => {
    const d = await api('/api/dashboard');
    if (!$('#stats')) return;
    offset = d.now - Date.now() / 1000; zone = d.timezone; tick();
    $('#stats').innerHTML = [['In now', d.in_now], ['Came today', d.present], ['Late', d.late], ['Not in yet', d.not_in], ['Active employees', d.total]]
      .map(([l, n]) => `<div class="stat"><b class="num">${n}</b><span>${l}</span></div>`).join('');
    $('#devs').innerHTML = d.devices.length
      ? d.devices.map((v) => `<span><span class="dot ${v.online ? 'on' : ''}"></span>${esc(v.name)} ${v.online ? 'online' : 'offline'}</span>`).join('')
      : '<span class="muted">No device added yet</span>';
    const maxId = d.recent.reduce((m, p) => Math.max(m, p.id), 0);
    $('#tape').innerHTML = d.recent.length ? d.recent.map((p) => `<li class="${lastId !== null && p.id > lastId ? 'fresh' : ''}">
        <time class="num">${esc(p.time)}${p.date !== d.today ? `<small>${esc(p.date)}</small>` : ''}</time>
        <div class="who"><strong>${esc(p.name)}</strong><span>${esc(p.department)}</span><span>${esc(p.emp_code)}</span></div>
        <span class="stamp ${p.type}">${p.type}</span></li>`).join('')
      : '<li style="display:block" class="empty">No punches yet. When someone scans their finger, it shows up here.</li>';
    lastId = maxId;
  };
  await load();
  timers.push(setInterval(tick, 1000), setInterval(() => load().catch(() => {}), 4000));
};

/* ---------- enroll progress ---------- */
function watchCommand(cmdId, title, onDone) {
  let stopped = false, last = '', since = Date.now();
  const m = openModal(`<h2>${esc(title)}</h2><div class="enroll"><div class="pulse" id="pl"></div>
    <p class="big" id="wm">Waiting for the device</p><p class="hint" id="wh" style="min-height:1.3em"></p></div>
    <div class="actions"><button class="btn danger" id="wc">Cancel</button><button class="btn" data-close>Close</button></div>`, () => { stopped = true; onDone && onDone(); });
  $('#wc', m.el).onclick = async () => { try { await api(`/api/commands/${cmdId}/cancel`, 'POST'); } catch {} };
  const poll = async () => {
    if (stopped) return;
    try {
      const c = await api('/api/commands/' + cmdId);
      if (c.message !== last) { last = c.message; since = Date.now(); }
      $('#wm', m.el).textContent = c.message || '…';
      if (c.status === 'done') { $('#pl', m.el).className = 'pulse done'; $('#wc', m.el).hidden = true; $('#wh', m.el).textContent = 'Done.'; stopped = true; onDone && onDone(); return; }
      if (c.status === 'failed') { $('#pl', m.el).className = 'pulse fail'; $('#wc', m.el).hidden = true; $('#wh', m.el).textContent = 'Not completed. Close this and try again.'; stopped = true; onDone && onDone(); return; }
      $('#wh', m.el).textContent = Date.now() - since > 8000 && c.status !== 'progress' ? 'Still waiting. Check that the device is powered on and connected to WiFi.' : '';
    } catch {}
    if (!stopped) setTimeout(poll, 1000);
  };
  poll();
}

/* ---------- employees ---------- */
views.employees = async (el) => {
  el.innerHTML = `<header class="page-head"><div><h1>Employees</h1><p class="muted">Add people, then enroll their fingerprint from here.</p></div>
    <div class="tools"><input id="q" placeholder="Search name or ID" aria-label="Search employees" style="width:220px"><button class="btn primary" id="add">Add employee</button></div></header>
    <section class="panel tablewrap" id="tbl"></section>`;
  let list = [];
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase();
    const rows = list.filter((e) => !q || e.name.toLowerCase().includes(q) || e.emp_code.toLowerCase().includes(q));
    $('#tbl').innerHTML = rows.length ? `<table><thead><tr><th>ID</th><th>Name</th><th>Shift</th><th>Fingerprint</th><th></th></tr></thead><tbody>${rows.map((e) => {
      const chip = e.command ? `<span class="chip wait">${e.command.type === 'enroll' ? 'Enrolling' : 'Removing'}</span>`
        : e.enrolled ? `<span class="chip ok">Enrolled, slot ${e.finger_id}</span>` : '<span class="chip none">No fingerprint</span>';
      const act = e.command ? `<button class="btn sm" data-act="watch" data-id="${e.id}" data-cmd="${e.command.id}">View progress</button>`
        : `<button class="btn sm" data-act="enroll" data-id="${e.id}">${e.enrolled ? 'Re-enroll' : 'Enroll fingerprint'}</button>`;
      return `<tr><td class="num">${esc(e.emp_code)}</td><td>${esc(e.name)}${e.active ? '' : ' <span class="chip none">Inactive</span>'}<span class="sub">${esc(e.department)}</span></td>
        <td class="num">${esc(e.shift_start)} to ${esc(e.shift_end)}</td><td>${chip}</td>
        <td class="acts">${act}<button class="btn sm" data-act="edit" data-id="${e.id}">Edit</button><button class="btn sm danger" data-act="del" data-id="${e.id}">Delete</button></td></tr>`;
    }).join('')}</tbody></table>` : `<div class="empty">${list.length ? 'No one matches that search.' : 'No employees yet. Select "Add employee" to create the first one.'}</div>`;
  };
  const load = async () => { list = await api('/api/employees'); draw(); };
  const find = (id) => list.find((e) => e.id === Number(id));
  const form = (e) => {
    const m = openModal(`<h2>${e ? 'Edit employee' : 'Add employee'}</h2><form class="stack" id="ef">
      <div class="row"><div class="field"><label for="f1">Employee ID</label><input id="f1" maxlength="20" required value="${esc(e?.emp_code)}"></div>
      <div class="field"><label for="f2">Full name</label><input id="f2" maxlength="60" required value="${esc(e?.name)}"></div></div>
      <div class="field"><label for="f3">Department</label><input id="f3" maxlength="40" value="${esc(e?.department)}"></div>
      <div class="row"><div class="field"><label for="f4">Shift starts</label><input id="f4" type="time" required value="${esc(e?.shift_start || '09:00')}"></div>
      <div class="field"><label for="f5">Shift ends</label><input id="f5" type="time" required value="${esc(e?.shift_end || '18:00')}"></div></div>
      ${e ? `<div class="checks"><label><input type="checkbox" id="f6" ${e.active ? 'checked' : ''}> Active (shows in reports)</label></div>` : ''}
      ${e && e.enrolled && !e.command ? '<div><button type="button" class="btn sm danger" id="unenr">Remove fingerprint from the device</button></div>' : ''}
      <div class="err" id="fe" role="alert"></div>
      <div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save</button></div></form>`);
    const un = $('#unenr', m.el);
    if (un) un.onclick = async () => { try { await api(`/api/employees/${e.id}/unenroll`, 'POST'); toast('Removal sent to the device'); m.close(); load(); } catch (x) { $('#fe', m.el).textContent = x.message; } };
    $('#ef', m.el).onsubmit = async (ev) => {
      ev.preventDefault();
      const body = { emp_code: $('#f1', m.el).value, name: $('#f2', m.el).value, department: $('#f3', m.el).value, shift_start: $('#f4', m.el).value, shift_end: $('#f5', m.el).value };
      if (e) body.active = $('#f6', m.el).checked;
      try { await (e ? api('/api/employees/' + e.id, 'PUT', body) : api('/api/employees', 'POST', body)); toast(e ? 'Changes saved' : 'Employee added'); m.close(); load(); }
      catch (x) { $('#fe', m.el).textContent = x.message; }
    };
  };
  $('#add').onclick = () => form(null);
  $('#q').oninput = draw;
  $('#tbl').addEventListener('click', async (ev) => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const e = find(b.dataset.id);
    if (b.dataset.act === 'edit') form(e);
    else if (b.dataset.act === 'watch') watchCommand(Number(b.dataset.cmd), 'Fingerprint: ' + e.name, load);
    else if (b.dataset.act === 'enroll') {
      try { const r = await api(`/api/employees/${e.id}/enroll`, 'POST'); load(); watchCommand(r.command_id, 'Enroll ' + e.name, load); }
      catch (x) { toast(x.message, true); }
    } else if (b.dataset.act === 'del') {
      if (await confirmBox('Delete ' + e.name + '?', 'This also deletes their punch history and removes their fingerprint from the device. To keep history, edit the employee and clear "Active" instead.', 'Delete employee')) {
        try { await api('/api/employees/' + e.id, 'DELETE'); toast('Employee deleted'); load(); } catch (x) { toast(x.message, true); }
      }
    }
  });
  await load();
  timers.push(setInterval(() => { if (!document.querySelector('.scrim')) load().catch(() => {}); }, 5000));
};

/* ---------- attendance ---------- */
views.attendance = async (el) => {
  const emps = await api('/api/employees');
  const first = await api('/api/report');
  el.innerHTML = `<div id="att"><header class="page-head"><div><h1>Attendance</h1><p class="muted">Daily summary and every individual punch.</p></div>
    <div class="tools"><button class="btn" id="addp">Add missing punch</button><a class="btn primary" id="csv" href="#">Export CSV</a></div></header>
    <section class="panel panel-pad stack" style="margin-bottom:18px">
      <div class="row"><div class="field"><label for="from">From</label><input type="date" id="from" value="${first.from}"></div>
      <div class="field"><label for="to">To</label><input type="date" id="to" value="${first.to}"></div>
      <div class="field"><label for="emp">Employee</label><select id="emp"><option value="">Everyone</option>${emps.map((e) => `<option value="${e.id}">${esc(e.name)} (${esc(e.emp_code)})</option>`).join('')}</select></div></div>
      <div class="tools"><button class="btn sm" data-r="0">Today</button><button class="btn sm" data-r="6">Last 7 days</button><button class="btn sm" data-r="29">Last 30 days</button><button class="btn sm" data-r="m">This month</button></div></section>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-t="sum">Daily summary</button><button role="tab" aria-selected="false" data-t="log">Punch log</button></div>
    <p class="hint" id="note" style="margin-bottom:10px"></p><section class="panel tablewrap" id="out"></section></div>`;
  let tab = 'sum';
  const qs = () => { const p = new URLSearchParams({ from: $('#from').value, to: $('#to').value }); if ($('#emp').value) p.set('employee_id', $('#emp').value); return p.toString(); };
  const load = async () => {
    $('#csv').href = '/api/report.csv?' + qs();
    try {
      if (tab === 'sum') {
        const r = await api('/api/report?' + qs());
        const c = (s) => r.rows.filter((x) => x.status === s).length;
        $('#note').textContent = `${r.rows.length} rows. ${c('Absent')} absent, ${r.rows.filter((x) => x.late_min > 0).length} late, ${c('Missing out')} missing a punch out.`;
        $('#out').innerHTML = r.rows.length ? `<table><thead><tr><th>Date</th><th>Employee</th><th>In</th><th>Out</th><th>Hours worked</th><th>Status</th></tr></thead><tbody>${r.rows.slice().reverse().map((x) => `<tr>
          <td class="num">${esc(x.date)}</td><td>${esc(x.name)}<span class="sub">${esc(x.emp_code)}</span></td><td class="num">${esc(x.first_in || '–')}</td><td class="num">${esc(x.last_out || '–')}</td>
          <td class="num">${fmtHM(x.work_min)}</td><td>${statusChip(x)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No employees to report on yet.</div>';
      } else {
        const rows = await api('/api/punches?' + qs());
        $('#note').textContent = `${rows.length} punches in this range.`;
        $('#out').innerHTML = rows.length ? `<table><thead><tr><th>Date</th><th>Time</th><th>Employee</th><th>Type</th><th>Source</th><th></th></tr></thead><tbody>${rows.map((p) => `<tr>
          <td class="num">${esc(p.date)}</td><td class="num">${esc(p.time)}</td><td>${esc(p.name)}<span class="sub">${esc(p.emp_code)}</span></td>
          <td><span class="stamp ${p.type}" style="font-size:.8rem;padding:1px 8px">${p.type}</span></td><td>${p.source === 'manual' ? 'Added by admin' : 'Fingerprint'}</td>
          <td class="acts"><button class="btn sm danger" data-del="${p.id}">Delete</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">No punches in this range.</div>';
      }
    } catch (e) { $('#out').innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
  };
  ['from', 'to', 'emp'].forEach((id) => { $('#' + id).onchange = load; });
  el.querySelector('.tabs').onclick = (ev) => {
    const b = ev.target.closest('[data-t]'); if (!b) return; tab = b.dataset.t;
    el.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', x === b)); load();
  };
  $('#att').addEventListener('click', async (ev) => {
    const r = ev.target.closest('[data-r]');
    if (r) {
      const to = new Date(), fmt = (d) => d.toLocaleDateString('en-CA');
      let from = new Date();
      if (r.dataset.r === 'm') from = new Date(to.getFullYear(), to.getMonth(), 1); else from.setDate(from.getDate() - Number(r.dataset.r));
      $('#from').value = fmt(from); $('#to').value = fmt(to); load();
    }
    const d = ev.target.closest('[data-del]');
    if (d && await confirmBox('Delete this punch?', 'Reports will be recalculated without it.', 'Delete punch')) {
      try { await api('/api/punches/' + d.dataset.del, 'DELETE'); load(); } catch (e) { toast(e.message, true); }
    }
  });
  $('#addp').onclick = () => {
    if (!emps.length) return toast('Add an employee first', true);
    const m = openModal(`<h2>Add missing punch</h2><form class="stack" id="pf">
      <div class="field"><label for="pe">Employee</label><select id="pe">${emps.map((e) => `<option value="${e.id}">${esc(e.name)} (${esc(e.emp_code)})</option>`).join('')}</select></div>
      <div class="row"><div class="field"><label for="pd">Date</label><input type="date" id="pd" required value="${$('#to').value}"></div>
      <div class="field"><label for="pt">Time</label><input type="time" id="pt" required value="09:00"></div></div>
      <div class="field"><label for="py">Type</label><select id="py"><option>IN</option><option>OUT</option></select></div>
      <div class="err" id="pr" role="alert"></div><div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Add punch</button></div></form>`);
    $('#pf', m.el).onsubmit = async (ev) => {
      ev.preventDefault();
      try { await api('/api/punches', 'POST', { employee_id: Number($('#pe', m.el).value), date: $('#pd', m.el).value, time: $('#pt', m.el).value, type: $('#py', m.el).value }); toast('Punch added'); m.close(); load(); }
      catch (e) { $('#pr', m.el).textContent = e.message; }
    };
  };
  await load();
};

/* ---------- devices ---------- */
views.devices = async (el) => {
  el.innerHTML = `<header class="page-head"><div><h1>Devices</h1><p class="muted">Each punching unit has its own key.</p></div><button class="btn primary" id="addd">Add device</button></header>
    <section class="panel tablewrap" id="tbl"></section>
    <section class="panel panel-pad stack" style="margin-top:18px"><h2>Connect a device</h2>
      <p>In the device's WiFi setup page, enter this server address and the device key from the table above.</p>
      <p>Server address <span class="key" id="addr"></span></p>
      <p class="hint" id="lan"></p></section>`;
  const addr = location.origin;
  $('#addr').textContent = addr;
  if (/localhost|127\.0\.0\.1/.test(location.hostname)) $('#lan').textContent = 'You opened this page as "localhost". The device cannot reach that. Use this computer\'s network IP instead, for example http://192.168.1.20:' + (location.port || 80) + '.';
  const load = async () => {
    const list = await api('/api/devices');
    $('#tbl').innerHTML = list.length ? `<table><thead><tr><th>Device</th><th>Status</th><th>Device key</th><th></th></tr></thead><tbody>${list.map((d) => `<tr>
      <td>${esc(d.name)}<span class="sub">${d.fw ? 'Firmware ' + esc(d.fw) : 'Never connected'}</span></td>
      <td><span class="dot ${d.online ? 'on' : ''}"></span>${d.online ? 'Online' : 'Offline'}<span class="sub">Last seen ${ago(d.last_seen)}${d.ip ? ', ' + esc(d.ip) : ''}</span></td>
      <td><span class="key">${esc(d.api_key)}</span></td>
      <td class="acts"><button class="btn sm" data-copy="${esc(d.api_key)}">Copy key</button><button class="btn sm danger" data-wipe="${d.id}" data-name="${esc(d.name)}">Erase all fingerprints</button><button class="btn sm danger" data-del="${d.id}">Remove</button></td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">No devices yet. Select "Add device" to get a key for your first unit.</div>';
  };
  $('#addd').onclick = () => {
    const m = openModal(`<h2>Add device</h2><form class="stack" id="df"><div class="field"><label for="dn">Device name</label><input id="dn" maxlength="40" placeholder="Front door" required></div>
      <div class="err" id="de" role="alert"></div><div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Create key</button></div></form>`);
    $('#df', m.el).onsubmit = async (ev) => { ev.preventDefault(); try { await api('/api/devices', 'POST', { name: $('#dn', m.el).value }); m.close(); toast('Device added'); load(); } catch (e) { $('#de', m.el).textContent = e.message; } };
  };
  $('#tbl').addEventListener('click', async (ev) => {
    const c = ev.target.closest('[data-copy]');
    if (c) { try { await navigator.clipboard.writeText(c.dataset.copy); toast('Key copied'); } catch { toast('Select the key and copy it manually', true); } }
    const w = ev.target.closest('[data-wipe]');
    if (w && await confirmBox('Erase all fingerprints on ' + w.dataset.name + '?', 'Every enrolled fingerprint on this device is deleted, and everyone will need to enroll again. Employees and punch history are kept.', 'Erase all')) {
      try { const r = await api(`/api/devices/${w.dataset.wipe}/clear-fingerprints`, 'POST'); watchCommand(r.command_id, 'Erasing fingerprints', load); } catch (e) { toast(e.message, true); }
    }
    const d = ev.target.closest('[data-del]');
    if (d && await confirmBox('Remove this device?', 'It will stop being able to send punches until you set it up with a new key.', 'Remove device')) { await api('/api/devices/' + d.dataset.del, 'DELETE'); load(); }
  });
  await load();
  timers.push(setInterval(() => load().catch(() => {}), 5000));
};

/* ---------- settings ---------- */
views.settings = async (el) => {
  const s = await api('/api/settings');
  const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  el.innerHTML = `<header class="page-head"><div><h1>Settings</h1></div></header><div class="split">
    <form class="panel panel-pad stack" id="sf"><h2>Workplace</h2>
      <div class="row"><div class="field"><label for="sc">Company name</label><input id="sc" maxlength="60" value="${esc(s.company)}"></div>
      <div class="field"><label for="st">Time zone</label><input id="st" list="tzs" value="${esc(s.timezone)}"><datalist id="tzs">${s.timezones.map((z) => `<option value="${esc(z)}">`).join('')}</datalist></div>
      <div class="field"><label for="sg">Late grace period (minutes)</label><input id="sg" type="number" min="0" max="120" value="${s.grace_min}"></div></div>
      <div class="field"><label>Weekly off days</label><div class="checks">${days.map((d, i) => `<label><input type="checkbox" name="off" value="${i}" ${s.weekly_off.includes(i) ? 'checked' : ''}> ${d}</label>`).join('')}</div></div>
      <div class="err" id="se" role="alert"></div><div><button class="btn primary">Save settings</button></div></form>
    <form class="panel panel-pad stack" id="pf"><h2>Change password</h2>
      <div class="row"><div class="field"><label for="pc">Current password</label><input id="pc" type="password" autocomplete="current-password" required></div>
      <div class="field"><label for="pn">New password (8+ characters)</label><input id="pn" type="password" autocomplete="new-password" minlength="8" required></div></div>
      <div class="err" id="pe" role="alert"></div><div><button class="btn primary">Change password</button></div></form></div>`;
  $('#sf').onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api('/api/settings', 'PUT', { company: $('#sc').value, timezone: $('#st').value, grace_min: Number($('#sg').value), weekly_off: [...el.querySelectorAll('[name=off]:checked')].map((x) => Number(x.value)) });
      state.company = $('#sc').value || state.company; $('.brand').firstChild.textContent = state.company; $('#se').textContent = ''; toast('Settings saved');
    } catch (x) { $('#se').textContent = x.message; }
  };
  $('#pf').onsubmit = async (e) => {
    e.preventDefault();
    try { await api('/api/password', 'POST', { current: $('#pc').value, next: $('#pn').value }); $('#pf').reset(); $('#pe').textContent = ''; toast('Password changed'); }
    catch (x) { $('#pe').textContent = x.message; }
  };
};

/* ---------- start ---------- */
async function boot() {
  try {
    const me = await api('/api/me');
    state.company = me.company || state.company;
    if (me.logged_in) showShell(); else showLogin();
  } catch { showLogin(); }
}
boot();
</script>
</body>
